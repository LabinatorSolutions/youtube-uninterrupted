name: CI

permissions:
    contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint Extension
        run: bun run lint

      - name: Lint Markdown
        run: bun run lint:md

      - name: Typecheck Extension
        run: bun run typecheck

      - name: Install Chromium for tests
        run: bunx playwright install --with-deps chromium

      - name: Pause/Resume Regression Tests
        run: bun run test:e2e

      - name: Build Extension
        run: bun run build
