# rumdl - Markdown lint configuration
# https://github.com/rvben/rumdl

[global]
exclude = ["node_modules", "web-ext-artifacts", ".git"]

[MD013]
# Prose wraps at 120. Tables, code blocks and long URLs are exempt — reflowing
# those hurts readability rather than helping it.
line_length = 120
code_blocks = false
tables = false
headings = true
